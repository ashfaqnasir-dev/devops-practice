trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

stages:
  # ==========================================
  # Stage 1: BUILD
  # ==========================================
  - stage: BuildStage
    displayName: '1. Build Application'
    jobs:
      - job: BuildJob
        steps:
          - script: |
              echo "Starting Build Process..."
              echo "Listing files in the repository:"
              ls -la
            displayName: 'List Files'

          - script: |
              echo "Simulating Code Compilation..."
              sleep 2
              echo "Build Completed Successfully!"
            displayName: 'Compile Code'

  # ==========================================
  # Stage 2: DEPLOY (Depends on Build)
  # ==========================================
  - stage: DeployStage
    displayName: '2. Deploy to Production'
    dependsOn: BuildStage  # Sirf tab chalega jab Build pass ho
    jobs:
      - job: DeployJob
        steps:
          - script: |
              echo "Starting Deployment..."
              echo "Deploying to the server..."
              sleep 2
              echo "Deployment Successful! 🚀"
            displayName: 'Deploy Script'
