# ============================================
# DevOps Practice — CI Pipeline
# ============================================

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - "03-bash-scripting/**"
      - "10-terraform-iac/**"

pool:
  vmImage: "ubuntu-latest"

steps:
  # 1. Build Info
  - script: |
      echo "============================================"
      echo "DevOps Practice CI"
      echo "============================================"
      echo "Branch: $(Build.SourceBranchName)"
      echo "Commit: $(Build.SourceVersion)"
      echo "Triggered by: $(Build.Reason)"
    displayName: "Show build info"

  # 2. ShellCheck
  - script: |
      echo "=== Installing ShellCheck ==="
      sudo apt install -y shellcheck
      echo ""
      echo "=== Bash Scripts Found ==="
      find 03-bash-scripting -name "*.sh" | wc -l
      echo ""
      echo "=== Running ShellCheck ==="
      find 03-bash-scripting -name "*.sh" -exec shellcheck {} \; || true
    displayName: "Check Bash Scripts"

  # 3. Run Real Script
  - script: |
      echo "=== Running hello.sh ==="
      chmod +x 03-bash-scripting/Day1/hello.sh
      bash 03-bash-scripting/Day1/hello.sh
    displayName: "Run hello.sh"

  # 4. Terraform
  - script: |
      echo "=== Installing Terraform ==="
      wget -q https://releases.hashicorp.com/terraform/1.9.5/terraform_1.9.5_linux_amd64.zip
      unzip -q terraform_1.9.5_linux_amd64.zip
      sudo mv terraform /usr/local/bin/
      terraform --version
      echo ""
      echo "=== Terraform Files ==="
      find 10-terraform-iac -name "*.tf" | head -5
    displayName: "Check Terraform"

  # 5. Success
  - script: |
      echo ""
      echo "============================================"
      echo "✅ CI Pipeline Complete"
      echo "============================================"
    displayName: "Success"
